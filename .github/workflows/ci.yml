name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs the postinstall `prisma generate`, so the client
      # is available for typechecking and the build.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Placeholder values: the build only needs these to compile.
          # No real services are contacted during CI (pages are dynamic and
          # the DB/Ably are not reached at build time).
          DATABASE_URL: mongodb://localhost:27017/ci
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
          ABLY_API_KEY: ci:placeholder
          NEXT_TELEMETRY_DISABLED: "1"
